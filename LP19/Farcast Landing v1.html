<style>
  html, body { background: #FFFCF8; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #1C1917; -webkit-font-smoothing: antialiased; }
  .display { letter-spacing: -0.05em; }
  .display-xl { letter-spacing: -0.055em; }
  .eyebrow { font-family: 'Geist Mono', ui-monospace, monospace; letter-spacing: 0.04em; font-size: 11px; text-transform: uppercase; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .hairline { border-color: #E7E5E4; }
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(28,25,23,0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(28,25,23,0.045) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .fade-mask {
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);
            mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%);

  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .pulse-dot { animation: pulse-dot 1.4s ease-in-out infinite; }
  @keyframes ticker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }

  .ticker-track { animation: ticker 40s linear infinite; }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* ---------- Inline icons (no external dep needed) ---------- */
const Icon = {
  Arrow: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>),
  Check: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M20 6 9 17l-5-5"/></svg>),
  Dot:   (p) => (<svg viewBox="0 0 8 8" {...p}><circle cx="4" cy="4" r="3" fill="currentColor"/></svg>),
  Spark: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>),
  Globe: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>),
  Mic:   (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>),
  Eye:   (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>),
  Bolt:  (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>),
  Chart: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 5-6"/></svg>),
  Shield:(p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/></svg>),
  Reply: (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12c0-4 3-7 7-7h7a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4h-7l-4 4v-4H6a3 3 0 0 1-3-3Z"/></svg>),
  Lock:  (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>),
  Plug:  (p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-6 6 6 6 0 0 1-6-6V8ZM12 17v5"/></svg>),
  Cursor:(p) => (<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="m4 4 7 17 2.5-7L21 11 4 4Z"/></svg>),
  X:     (p) => (<svg viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M18.244 2H21l-6.49 7.41L22 22h-6.99l-4.74-6.16L4.8 22H2.04l6.96-7.95L2 2h7.16l4.27 5.65L18.244 2Zm-1.22 18.39h1.66L7.06 3.5H5.3l11.724 16.89Z"/></svg>),
  Reddit:(p) => (<svg viewBox="0 0 24 24" fill="currentColor" {...p}><circle cx="12" cy="12" r="10"/><circle cx="9" cy="13" r="1.1" fill="#fff"/><circle cx="15" cy="13" r="1.1" fill="#fff"/><path d="M8.5 15.6c1 .9 2.2 1.3 3.5 1.3s2.5-.4 3.5-1.3" stroke="#fff" strokeWidth="1.2" strokeLinecap="round" fill="none"/></svg>),
  Linked:(p) => (<svg viewBox="0 0 24 24" fill="currentColor" {...p}><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1 0-5ZM3 9h4v12H3V9Zm7 0h3.8v1.7h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.4c0-1.29-.02-2.94-1.79-2.94-1.8 0-2.07 1.4-2.07 2.85V21h-4V9Z"/></svg>),
};

/* ---------- Reusable bits ---------- */
const Logo = () => (
  <div className="flex items-center gap-2.5">
    <img src="assets/farcast-logo.png" alt="" className="h-8 w-auto rounded-md" style={{objectFit:'cover', objectPosition:'left', width:'34px'}}/>
    <span className="text-[19px] font-semibold tracking-[-0.02em]">Farcast</span>
  </div>
);

const Eyebrow = ({children, className=""}) => (
  <span className={"eyebrow text-stone-500 " + className}>{children}</span>
);

const Pill = ({children, tone="neutral"}) => {
  const map = {
    neutral: "bg-stone-100 text-stone-700 border-stone-200",
    coral:   "bg-coral/10 text-coral border-coral/20",
    green:   "bg-emerald-50 text-emerald-700 border-emerald-200",
    amber:   "bg-amber-50 text-amber-800 border-amber-200",
    ink:     "bg-ink text-cream border-ink",
  };
  return <span className={"inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full border text-[11px] font-medium " + map[tone]}>{children}</span>;
};

const Section = ({eyebrow, title, lede, children, id}) => (
  <section id={id} className="border-t hairline">
    <div className="max-w-[1240px] mx-auto px-6 lg:px-10 py-24 lg:py-32">
      <div className="grid lg:grid-cols-12 gap-10 mb-14">
        <div className="lg:col-span-4">
          <Eyebrow>{eyebrow}</Eyebrow>
        </div>
        <div className="lg:col-span-8">
          <h2 className="display text-[44px] lg:text-[56px] leading-[1.02] font-semibold max-w-[20ch]">{title}</h2>
          {lede && <p className="mt-5 text-stone-600 text-[17px] leading-[1.55] max-w-[58ch]">{lede}</p>}
        </div>
      </div>
      {children}
    </div>
  </section>
);

/* ---------- NAV ---------- */
const Nav = () => (
  <div className="sticky top-0 z-40 backdrop-blur-md bg-cream/80 border-b hairline">
    <div className="max-w-[1240px] mx-auto px-6 lg:px-10 h-14 flex items-center justify-between">
      <Logo />
      <nav className="hidden md:flex items-center gap-8 text-[13.5px] text-stone-600">
        <a href="#engine" className="hover:text-ink">Engine</a>
        <a href="#dashboard" className="hover:text-ink">Dashboard</a>
        <a href="#extension" className="hover:text-ink">Extension</a>
        <a href="#safety" className="hover:text-ink">Safety</a>
        <a href="#pricing" className="hover:text-ink">Pricing</a>
      </nav>
      <div className="flex items-center gap-2">
        <button className="hidden sm:inline-flex text-[13.5px] text-stone-700 px-3 py-1.5 rounded-md hover:bg-stone-100">Sign in</button>
        <button className="text-[13.5px] font-medium bg-ink text-cream px-3.5 py-1.5 rounded-md hover:bg-stone-800">Start free</button>
      </div>
    </div>
  </div>
);

/* ---------- HERO ---------- */
const Hero = () => {
  const [url, setUrl] = useState("https://your-saas.com");
  const [stage, setStage] = useState("idle"); // idle | running | done
  const [steps, setSteps] = useState([0,0,0]); // 0 pending, 1 active, 2 done
  const timers = useRef([]);

  const run = () => {
    if (stage === "running") return;
    setStage("running");
    setSteps([1,0,0]);
    timers.current.forEach(clearTimeout);
    timers.current = [
      setTimeout(() => setSteps([2,1,0]), 900),
      setTimeout(() => setSteps([2,2,1]), 1800),
      setTimeout(() => { setSteps([2,2,2]); setStage("done"); }, 2700),
    ];
  };

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  return (
    <section className="relative border-b hairline">
      <div className="absolute inset-0 grid-bg fade-mask pointer-events-none"></div>
      <div className="relative max-w-[1240px] mx-auto px-6 lg:px-10 pt-20 lg:pt-28 pb-24 lg:pb-32">
        <div className="grid lg:grid-cols-12 gap-12 items-start">
          <div className="lg:col-span-7">
            <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded-full border hairline bg-white/70 mb-7">
              <span className="inline-block w-1.5 h-1.5 rounded-full bg-coral pulse-dot"></span>
              <span className="eyebrow text-stone-700">Now in private beta · v0.4</span>
            </div>
            <h1 className="display-xl text-[56px] sm:text-[72px] lg:text-[88px] leading-[0.96] font-semibold">
              Building is easy.<br/>
              <span className="text-stone-400">Distribution isn't.</span>
            </h1>
            <p className="mt-7 text-[18px] lg:text-[19px] leading-[1.5] text-stone-600 max-w-[58ch]">
              You shipped the product. Now you're four months in, posting twice, watching your launch drift off the front page. Farcast runs the boring half of growth on autopilot.
            </p>

            {/* URL Wedge */}
            <form onSubmit={(e)=>{e.preventDefault(); run();}} className="mt-9">
              <div className="flex items-center gap-2 p-1.5 rounded-xl border hairline bg-white shadow-sm max-w-[620px]">
                <div className="pl-3 pr-1 text-stone-400"><Icon.Globe width="18" height="18"/></div>
                <input
                  value={url}
                  onChange={(e)=>setUrl(e.target.value)}
                  onFocus={(e)=>{ if(url==="https://your-saas.com") e.target.select(); }}
                  className="flex-1 bg-transparent py-2.5 text-[15.5px] focus-ring rounded-md"
                  spellCheck="false"
                />
                <button type="submit"
                  className="inline-flex items-center gap-2 bg-coral text-white text-[14px] font-medium pl-4 pr-3.5 py-2.5 rounded-lg hover:brightness-95 transition focus-ring">
                  {stage === "running" ? "Reading site…" : stage === "done" ? "Playbook ready" : "Generate Growth Playbook"}
                  <Icon.Arrow width="16" height="16"/>
                </button>
              </div>
              <div className="mt-3 flex items-center gap-4 text-[12.5px] text-stone-500">
                <span className="inline-flex items-center gap-1.5"><Icon.Lock width="13" height="13"/> No card. 7-day full access.</span>
                <span className="hidden sm:inline-flex items-center gap-1.5"><Icon.Bolt width="13" height="13"/> First draft in ~90 seconds.</span>
              </div>
            </form>

            {/* Live run readout */}
            <div className="mt-9 max-w-[620px] rounded-xl border hairline bg-white overflow-hidden">
              <div className="flex items-center justify-between px-4 py-2 border-b hairline bg-stone-50/60">
                <span className="eyebrow text-stone-600">hermes · agent log</span>
                <span className="mono text-[11px] text-stone-500">{stage === "done" ? "completed" : stage === "running" ? "running" : "idle"}</span>
              </div>
              <div className="px-4 py-3 mono text-[12.5px] leading-[1.85] text-stone-700">
                <LogLine state={steps[0]} label="GET /scrape" detail={`→ ${url.replace(/^https?:\/\//,'')}`}/>
                <LogLine state={steps[1]} label="POST /icp.infer" detail="→ buyers · triggers · objections"/>
                <LogLine state={steps[2]} label="POST /voice.clone" detail="→ tone · cadence · post shape"/>
              </div>
              {stage === "done" && (
                <div className="px-4 py-3 border-t hairline bg-coral/[0.04] flex items-center justify-between">
                  <span className="text-[13px] text-stone-700">Playbook drafted · 12 posts · 38 warm leads queued</span>
                  <button className="text-[12.5px] font-medium text-coral inline-flex items-center gap-1">Open dashboard <Icon.Arrow width="13" height="13"/></button>
                </div>
              )}
            </div>
          </div>

          {/* Right column — preview card */}
          <div className="lg:col-span-5">
            <HeroPreview />
          </div>
        </div>

        {/* Logo strip */}
        <div className="mt-20 pt-8 border-t hairline">
          <div className="flex items-center gap-6 flex-wrap">
            <span className="eyebrow text-stone-500">Trusted by 240+ indie founders shipping {"<"}$2M ARR SaaS</span>
            <div className="flex-1 min-w-[280px] overflow-hidden">
              <div className="flex items-center gap-10 ticker-track">
                {[...Array(2)].map((_,k)=>(
                  <div key={k} className="flex items-center gap-10 shrink-0 pr-10">
                    {["Bramble","Quirly","Northbeam Jr","Heron","Pagestate","Anchorline","Salt&Co","Mentora","Strata","Drift.ly"].map((n,i)=>(
                      <span key={i} className="text-[15px] tracking-[-0.02em] text-stone-400 whitespace-nowrap">{n}</span>
                    ))}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

const LogLine = ({state, label, detail}) => {
  const color = state===2 ? "text-emerald-600" : state===1 ? "text-coral" : "text-stone-300";
  const mark  = state===2 ? "✓" : state===1 ? "▸" : "·";
  return (
    <div className="flex items-baseline gap-3">
      <span className={`w-3 text-center ${color}`}>{mark}</span>
      <span className="text-stone-500">{label}</span>
      <span className={state===1 ? "text-coral" : "text-stone-600"}>{detail}{state===1 && <span className="ml-1 pulse-dot">▌</span>}</span>
    </div>
  );
};

/* ---------- HERO PREVIEW (mini dashboard) ---------- */
const HeroPreview = () => (
  <div className="rounded-2xl border hairline bg-white shadow-sm overflow-hidden">
    <div className="flex items-center justify-between px-4 py-2.5 border-b hairline">
      <div className="flex items-center gap-1.5">
        <span className="w-2.5 h-2.5 rounded-full bg-stone-200"></span>
        <span className="w-2.5 h-2.5 rounded-full bg-stone-200"></span>
        <span className="w-2.5 h-2.5 rounded-full bg-stone-200"></span>
      </div>
      <span className="mono text-[11px] text-stone-400">farcast.app/today</span>
      <span className="eyebrow text-stone-400">Tue · May 19</span>
    </div>
    <div className="p-5">
      <div className="flex items-center justify-between mb-4">
        <div>
          <div className="eyebrow text-stone-500">Today's playbook</div>
          <h3 className="text-[20px] tracking-[-0.02em] font-semibold mt-1">7 drafts ready · 3 leads hot</h3>
        </div>
        <Pill tone="coral"><Icon.Dot className="w-1.5 h-1.5"/> Live</Pill>
      </div>

      <div className="space-y-2.5">
        <DraftRow platform="x"   tag="thread"  text="The boring growth loop nobody talks about: shipping isn't a launch, it's a beat. Last week we…" intent={94}/>
        <DraftRow platform="li"  tag="post"    text="I spent four months posting twice. Here's what I'd do differently if I started today →" intent={71}/>
        <DraftRow platform="rd"  tag="reply"   text="OP — I ran the same playbook on r/SaaS last quarter. The 90/10 rule is real, but…" intent={58}/>
      </div>

      <div className="mt-5 pt-4 border-t hairline">
        <div className="flex items-center justify-between mb-2.5">
          <div className="eyebrow text-stone-500">Warm leads · 38 queued</div>
          <span className="mono text-[11px] text-stone-400">native intent score</span>
        </div>
        <div className="space-y-1.5">
          <LeadRow name="@mira_builds"  bio="building a billing API · 2 mo" score={92} hot/>
          <LeadRow name="@otto.dev"     bio="ex-Stripe · scoping crm tool" score={84}/>
          <LeadRow name="@hellofelix"   bio="indie · stuck at $4k MRR"     score={77}/>
        </div>
      </div>
    </div>
  </div>
);

const PlatformChip = ({p}) => {
  const map = {
    x:  { Icon: Icon.X,      bg: "bg-ink text-cream" },
    li: { Icon: Icon.Linked, bg: "bg-[#0a66c2] text-white" },
    rd: { Icon: Icon.Reddit, bg: "bg-[#ff4500] text-white" },
  };
  const { Icon: I, bg } = map[p];
  return <span className={`inline-flex items-center justify-center w-5 h-5 rounded ${bg}`}><I width="11" height="11"/></span>;
};

const DraftRow = ({platform, tag, text, intent}) => (
  <div className="group rounded-lg border hairline bg-white hover:border-stone-300 transition px-3 py-2.5">
    <div className="flex items-center gap-2 mb-1">
      <PlatformChip p={platform}/>
      <span className="eyebrow text-stone-500">{tag}</span>
      <span className="ml-auto mono text-[10.5px] text-stone-400">intent {intent}</span>
    </div>
    <p className="text-[13px] leading-[1.45] text-stone-700 line-clamp-2">{text}</p>
  </div>
);

const LeadRow = ({name, bio, score, hot}) => (
  <div className="flex items-center gap-3 py-1.5">
    <div className="w-7 h-7 rounded-full bg-gradient-to-br from-stone-200 to-stone-300 shrink-0"></div>
    <div className="flex-1 min-w-0">
      <div className="text-[13px] font-medium truncate">{name}</div>
      <div className="text-[11.5px] text-stone-500 truncate">{bio}</div>
    </div>
    <div className="flex items-center gap-2 shrink-0">
      {hot && <Pill tone="coral"><Icon.Dot className="w-1.5 h-1.5"/>Hot lead</Pill>}
      <span className="mono text-[11.5px] text-stone-600 w-7 text-right">{score}</span>
    </div>
  </div>
);

/* ---------- SECTION 2 · STRATEGY ENGINE ---------- */
const StrategyEngine = () => {
  const steps = [
    {
      n: "01", k: "URL Scraped", icon: Icon.Globe,
      title: "Hermes maps your exact ICP and buying triggers.",
      body: "Crawls your site, docs, changelog, and pricing — then reverse-engineers who actually buys and what makes them open the email.",
      log: [
        ["scan", "/pricing → 3 plans · $40 ceiling"],
        ["scan", "/changelog → 12 weekly notes"],
        ["infer", "ICP: solo · post-MVP · pre-PMF"],
        ["infer", "triggers: failed launch · $0 MRR · churn"],
      ],
    },
    {
      n: "02", k: "Voice Cloned", icon: Icon.Mic,
      title: "Procedural memory matches your formatting and tone.",
      body: "Reads your past 200 posts on X, LinkedIn, and Reddit. Learns line breaks, em-dash habits, the exact way you open a thread.",
      log: [
        ["read", "x.com/@you → 184 posts"],
        ["read", "linkedin → 41 posts"],
        ["fit",  "cadence: 2 short + 1 long / wk"],
        ["fit",  "voice: dry · concrete · self-deprecating"],
      ],
    },
    {
      n: "03", k: "Rivals Spied", icon: Icon.Eye,
      title: "Viral frameworks pulled from competitors in your niche.",
      body: "Quietly indexes the top 40 accounts in your category. Surfaces the post structures, hooks, and CTAs that actually moved the needle.",
      log: [
        ["index", "40 rival accounts · 12k posts"],
        ["cluster","17 viral frameworks isolated"],
        ["score", "top 3 ready to remix"],
        ["queue", "draft → today's playbook"],
      ],
    },
  ];

  return (
    <Section
      id="engine"
      eyebrow="02 · The strategy engine"
      title="What happens after you hit enter."
      lede="Three agents run in parallel for about ninety seconds. By the time your coffee's cold, the playbook is sitting in your inbox."
    >
