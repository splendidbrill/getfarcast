/* ---------- NEO DATA STREAM (left) ---------- */
const NEO_SNIPPETS = [
  "scrape(reddit/r/SaaS)", "{ icp: \"solo-founder\" }", "intent=0.94", "frame.extract()",
  "[ thread ] hook→cta", "voice.clone(184)", "</post>", "tokens: 2,048", "GET /pricing 200",

const NeoStream = () => {
  const cols = React.useMemo(() => {

/* ---------- RADAR SCANNER (right) ---------- */
const Radar = () => {
  const canvasRef = useRef(null);
  const raf = useRef(0);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let w = 0, h = 0, cx = 0, cy = 0, maxR = 0;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // warm leads at fixed polar positions (angle, radiusFraction)
    const leads = [
      [0.6, 0.42], [1.5, 0.74], [2.3, 0.55], [3.1, 0.86], [3.9, 0.34],
      [4.6, 0.68], [5.3, 0.5], [5.9, 0.82], [0.2, 0.9], [2.9, 0.28],
    ].map(([a, r]) => ({ a, r, lit: -999 }));

    let pings = []; // expanding coral rings on freshly-found leads
    let sweep = -Math.PI / 2;
    let prev = sweep;

    const build = () => {
      const rect = canvas.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = w * 0.66; cy = h * 0.44;
      maxR = Math.min(w, h) * 0.62;
    };

    const norm = (a) => { a %= Math.PI * 2; return a < 0 ? a + Math.PI * 2 : a; };

    const draw = (now) => {
      ctx.clearRect(0, 0, w, h);

      // concentric rings + crosshairs
      ctx.strokeStyle = "rgba(28,25,23,0.08)";
      ctx.lineWidth = 1;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, (maxR * i) / 4, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy);
      ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR);
      ctx.stroke();

      // sweep wedge (trailing gradient)
      const trail = 0.62;
      const grad = ctx.createConicGradient ? null : null;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, maxR, sweep - trail, sweep);
      ctx.closePath();
      const lg = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
      lg.addColorStop(0, "rgba(28,25,23,0.10)");
      lg.addColorStop(1, "rgba(28,25,23,0)");
      ctx.fillStyle = lg;
      ctx.fill();
      ctx.restore();

      // leading sweep line
      ctx.strokeStyle = "rgba(28,25,23,0.14)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(sweep) * maxR, cy + Math.sin(sweep) * maxR);
      ctx.stroke();

      // detect leads the sweep just crossed
      const a0 = norm(prev), a1 = norm(sweep);
      for (const L of leads) {
        const la = norm(L.a);
        const crossed = a0 <= a1 ? (la > a0 && la <= a1) : (la > a0 || la <= a1);
        if (crossed) {
          L.lit = now;
          pings.push({ x: cx + Math.cos(L.a) * L.r * maxR, y: cy + Math.sin(L.a) * L.r * maxR, t: 0 });
        }
      }

      // draw leads
      for (const L of leads) {
        const x = cx + Math.cos(L.a) * L.r * maxR;
        const y = cy + Math.sin(L.a) * L.r * maxR;
        const since = (now - L.lit) / 1000;
        const hot = since < 2.2;
        if (hot) {
          const k = 1 - since / 2.2; // decay 1→0
          ctx.fillStyle = `rgba(255,90,77,${0.5 + 0.5 * k})`;
          ctx.shadowColor = "rgba(255,90,77,0.7)";
          ctx.shadowBlur = 10 * k;
          ctx.beginPath();
          ctx.arc(x, y, 2.4 + 1.6 * k, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        } else {
          ctx.fillStyle = "rgba(28,25,23,0.18)";
          ctx.beginPath();
          ctx.arc(x, y, 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // expanding coral pings
      for (let i = pings.length - 1; i >= 0; i--) {
        const p = pings[i];
        p.t += 0.02;
        if (p.t >= 1) { pings.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(255,90,77,${0.45 * (1 - p.t)})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.t * 26, 0, Math.PI * 2);
        ctx.stroke();
      }

      prev = sweep;
      sweep += 0.0075; // slow, deliberate
      raf.current = requestAnimationFrame(draw);
    };

    build();
    if (reduce) {
      // single static frame with a couple leads lit
      sweep = 0.6; prev = 0.4;
      draw(performance.now());
      cancelAnimationFrame(raf.current);
    } else {
      raf.current = requestAnimationFrame(draw);
    }

    let rt;
    const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { cancelAnimationFrame(raf.current); build(); if (!reduce) raf.current = requestAnimationFrame(draw); }, 200); };
    window.addEventListener("resize", onResize);
    return () => { cancelAnimationFrame(raf.current); clearTimeout(rt); window.removeEventListener("resize", onResize); };
  }, []);

  return (
    <div className="absolute inset-y-0 right-0 w-[46%] overflow-hidden"
         style={{ WebkitMaskImage: "linear-gradient(to left, black 60%, transparent 100%)",
                          maskImage: "linear-gradient(to left, black 60%, transparent 100%)" }}>
      <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
    </div>
  );
};

/* ---------- HERO ---------- */

        {/* Frosted legibility panel (z-20) keeps headline + wedge the focal point */}

          {/* Massive headline */}

            Building is easy.<br/>
            <span className="text-stone-400">Distribution isn't.</span>
          </h1>

          {/* Subhead */}
          <p className="mt-7 lg:mt-8 mx-auto max-w-[680px] text-[17px] lg:text-[19px] leading-[1.5] text-stone-600">
            The autonomous AI growth co-founder that maps your ICP, clones your voice, and drops ready-to-publish posts and warm leads into your inbox every morning.
          </p>

          {/* Wedge */}
          <form onSubmit={(e)=>{ e.preventDefault(); run(); }} className="mt-9 mx-auto max-w-[640px]">

              <div className="pl-3 pr-1 text-stone-400 shrink-0"><Icon.Globe width="18" height="18"/></div>
              <input
                value={url}

                onFocus={(e)=>{ if(url==="https://your-saas.com") e.target.select(); }}
                className="flex-1 min-w-0 bg-transparent py-3 text-[15.5px] focus-ring rounded-md"
                spellCheck="false"
              />
              <button type="submit"

                {stage === "running" ? "Reading site…" : stage === "done" ? "Playbook ready" : "Get Started"}
                <Icon.Arrow width="15" height="15"/>
